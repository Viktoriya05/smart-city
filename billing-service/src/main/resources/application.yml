server:
  port: 8085

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_billing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: "veryLongSecretKeyForSmartCityProjectAtLeast256BitsLong1234567890"

# Адрес Notification-сервиса для межсервисных вызовов
services:
  notification:
    url: http://localhost:8086

logging:
  level:
    com.example.billing_service: DEBUG
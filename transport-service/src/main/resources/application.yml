server:
  port: 8082

spring:
  application:
    name: transport-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_transport?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Тот же секрет, что в Identity — чтобы проверять токены
jwt:
  secret: "veryLongSecretKeyForSmartCityProjectAtLeast256BitsLong1234567890"

logging:
  level:
    ru.smartcity.transport: DEBUG